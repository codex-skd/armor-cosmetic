name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Build with Gradle
        run: ./gradlew build
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armor_cosmetic-${{ github.ref_name }}
          path: build/libs/*.jar

  curseforge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: armor_cosmetic-${{ github.ref_name }}
          path: artifacts
          
      - name: Publish to CurseForge
        uses: CurseForge/curseforge-api@v1
        with:
          api-key: ${{ secrets.CURSEFORGE_API_KEY }}
          project-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          file-path: artifacts/armor_cosmetic-*.jar
          game-versions: '1.21.1'
          mod-loaders: 'NeoForge'
          release-type: release
          changelog: |
            Release ${{ github.ref_name }}
            
            ## Changes
            - Initial release 1.0.0
            - Default config values updated for better UI positioning
            - Recipe book disabled by default in cosmetic inventory
            - Toggle button positioned above main button
            - Config files organized in config/armor_cosmetic/ folder
            - Full Configured mod integration for hot-reload config editing
            - Fixed tooltip translations